# Build & Deploy to GitHub Pages
#
# 触发:push main / 每日 cron(北京 05:00,自动采集最新 GitHub 项目)/ 手动
# 关键点:portfolio 以 pnpm link:../cineView/cineview 依赖自研框架,
# CI 里把两个仓库按本地相同的相对布局 checkout,先构建 cineview dist 再装 portfolio。
name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: portfolio

      - uses: actions/checkout@v4
        with:
          repository: AlienMu/cineView
          path: cineView

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            portfolio/pnpm-lock.yaml
            cineView/cineview/pnpm-lock.yaml

      - name: Build cineview (link 依赖指向 dist,必须先行)
        working-directory: cineView/cineview
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install portfolio deps
        working-directory: portfolio
        run: pnpm install --frozen-lockfile

      - name: Fetch GitHub projects
        working-directory: portfolio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-repos.mjs

      - name: Subset fonts (覆盖新抓取数据的字形)
        working-directory: portfolio
        run: node scripts/subset-fonts.mjs

      - name: Build site
        working-directory: portfolio
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
